<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Replica of the navbar brand mark: gold "c" bracket, tilted -8deg -->
  <g transform="rotate(-8 32 32)">
    <!-- Bracket frame: rounded left corners, sharp-ish right corners -->
    <path
      d="M 50 6 L 28 6 Q 10 6 10 24 L 10 40 Q 10 58 28 58 L 50 58 Q 54 58 54 54 L 54 10 Q 54 6 50 6 Z"
      fill="#FFF6E0"
      stroke="#FFB800"
      stroke-width="5"
      stroke-linejoin="round"
    />
    <!-- The "c" glyph -->
    <path
      d="M 39.4 24.8 A 11 11 0 1 0 39.4 41.2"
      fill="none"
      stroke="#FFB800"
      stroke-width="6.5"
      stroke-linecap="round"
    />
  </g>
</svg>
